# Checks the casks of this tap on macOS: style, audit, then a real install and uninstall.
name: Test casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tap this checkout
        run: |
          brew tap robertod91/tap "$GITHUB_WORKSPACE"
          brew tap-info robertod91/tap

      - name: Style
        run: brew style --cask robertod91/tap/iconvader

      # Users install without `brew trust`: that must keep working. Only `brew audit` (maintainer
      # tool) refuses to load casks from untrusted third-party taps, so the tap is trusted after this.
      - name: Install as a user would (tap not trusted)
        run: |
          brew install --cask robertod91/tap/iconvader
          brew uninstall --cask robertod91/tap/iconvader

      - name: Trust the tap
        run: brew trust robertod91/tap

      - name: Audit
        env:
          # Read-only workflow token: avoids the 60 requests/hour limit for anonymous GitHub API calls
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --cask --online robertod91/tap/iconvader

      - name: Install, verify, uninstall
        run: |
          brew install --cask robertod91/tap/iconvader
          SAVER="$HOME/Library/Screen Savers/IcoNVader.saver"
          test -d "$SAVER"
          codesign --verify --strict --verbose=2 "$SAVER"
          codesign -dv --verbose=2 "$SAVER" 2>&1 | grep -E "Authority=Developer ID|TeamIdentifier"
          xcrun stapler validate "$SAVER"
          plutil -extract CFBundleShortVersionString raw "$SAVER/Contents/Info.plist"
          brew uninstall --cask --zap robertod91/tap/iconvader
          test ! -e "$SAVER"
